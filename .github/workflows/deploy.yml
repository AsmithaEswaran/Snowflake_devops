
name: Deploy SQL to Snowflake

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_CONNECTIONS_DEFAULT_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_CONNECTIONS_DEFAULT_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_CONNECTIONS_DEFAULT_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_CONNECTIONS_DEFAULT_WAREHOUSE: DEVOPS_WH
      SNOWFLAKE_CONNECTIONS_DEFAULT_DATABASE: DEVOPS_DEMO
      SNOWFLAKE_CONNECTIONS_DEFAULT_SCHEMA: PUBLIC

    steps:
      - name: Get code from GitHub
        uses: actions/checkout@v4

      - name: Set up Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          cli-version: "latest"

      - name: Test Snowflake connection
        run: snow sql -q "SELECT CURRENT_USER(), CURRENT_ROLE()"

      - name: Deploy SQL script
        run: snow sql -f scripts/deploy.sql
